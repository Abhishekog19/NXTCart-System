# Continuous frames; only Pi weight settlement triggers inference.
pc_product_verifier:
  ros__parameters:
    similarity_threshold: 0.65
    colour_threshold: 0.30
    size_ratio_tolerance: 3.0
    removal_margin: 0.03
    buffer_seconds: 3.0
    buffer_max_frames: 90
    min_samples: 1
    max_samples: 5
    settlement_timeout: 18.0
    result_timeout: 6.0
    max_inflight: 8
