# Full-frame motion sampling. No scan/cart regions or merge limits.
pc_product_verifier:
  ros__parameters:
    similarity_threshold: 0.65
    colour_threshold: 0.30
    size_ratio_tolerance: 3.0
    removal_margin: 0.03
    min_motion_area: 100.0
    warmup_frames: 15
    capture_seconds: 2.5
    sample_interval: 0.08
    min_samples: 3
    max_samples: 5
    result_timeout: 6.0
    max_inflight: 8
    removal_grace_seconds: 2.0
    quiet_seconds: 0.8
